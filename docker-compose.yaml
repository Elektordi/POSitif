version: '3.7'

services:
  backend:
    build:
      context: backend
      args:
        NODE_ENV: development
        #NODE_ENV: production
    volumes:
      - ./dist/data.db:/srv/app/data.db
    ports:
      - 1337:1337

  frontend:
    build:
      context: .
      args:
        LANG: fr
        #LANG: en
    ports:
      - 8000:8000
